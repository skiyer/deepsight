name: build_docker
on:
  push:
jobs:
  build_docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build extension and server artifacts
        run: |
          pnpm -C extension/webview-ui install --frozen-lockfile
          pnpm -C extension/webview-ui build
          pnpm -C extension install --frozen-lockfile
          pnpm -C extension compile
          pnpm -C extension package
          pnpm -C server install --frozen-lockfile
          pnpm -C server build
          LATEST_VSIX=$(ls -t extension/deepsight-*.vsix | head -1)
          if [ -z "$LATEST_VSIX" ]; then
            echo "VSIX not found" >&2
            exit 1
          fi
          cp "$LATEST_VSIX" docker/deepsight.vsix

      - name: Build and push deepsight-codeserver image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/deepsight:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: docker/Dockerfile

      - name: Build and push deepsight-cli image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/deepsight-cli:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: docker/Dockerfile.cli
